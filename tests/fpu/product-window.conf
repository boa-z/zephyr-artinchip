# Experimental board profile, not a new default or inferred peripheral map.
# Mirrors tests/kernel/product-window.conf so the FPU stress image is built in
# the same 64 KiB product window (samples/handoff_probe/product-window.overlay)
# with the owner-reported 144-slot CLIC table the packager verifies.
CONFIG_ARTINCHIP_D13X_BOOT_CONTRACT=y
# Owner-supplied CLICINFO=0x00600090, numint[12:0]=144.
CONFIG_ARTINCHIP_D13X_DIAGNOSTIC_144_IRQS=y
