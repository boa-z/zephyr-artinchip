# SPDX-License-Identifier: Apache-2.0
name: P0 and D13x software gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: zephyr-artinchip
    steps:
      - uses: actions/checkout@v4
        with:
          path: zephyr-artinchip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Install host packages
        run: |
          set -euo pipefail
          mkdir -p artifacts/r1-logs
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build device-tree-compiler xz-utils file qemu-system-riscv
          command -v qemu-system-riscv32 >/dev/null || {
            echo "FATAL: qemu-system-riscv32 is not on PATH after installing" \
              "qemu-system-riscv; check the package name and its file list." >&2
            exit 1
          }
          {
            cmake --version
            ninja --version
            dtc --version
            xz --version
            file --version
            qemu-system-riscv32 --version
            python --version
            python -c 'import sys; print(sys.executable, sys.version)'
          } > artifacts/r1-logs/host-packages.log
          cat artifacts/r1-logs/host-packages.log
          # The pinned Zephyr revision composes -cpu from devicetree ('rv32i' plus
          # zkr); an emulator without that model makes every scenario die as an
          # empty 'unexpected eof' instead of failing with a reason.
          qemu-system-riscv32 -cpu help > artifacts/r1-logs/qemu-cpu-models.log
          grep -qw rv32i artifacts/r1-logs/qemu-cpu-models.log || {
            echo "FATAL: host QEMU offers no 'rv32i' CPU model; the pinned" \
              "Zephyr revision needs a newer emulator than this host package." >&2
            exit 1
          }
      - name: Bootstrap pinned workspace
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-linux.lock \
            2>&1 | tee artifacts/r1-logs/pip-install.log
          west init -l . 2>&1 | tee artifacts/r1-logs/west-init.log
          west update 2>&1 | tee artifacts/r1-logs/west-update.log
          python scripts/apply_patches.py 2>&1 | tee artifacts/r1-logs/apply-patches.log
          west manifest --validate 2>&1 | tee artifacts/r1-logs/manifest-validate.log
      - name: Lint, source provenance and host tests
        run: |
          set -euo pipefail
          python scripts/lint.py 2>&1 | tee artifacts/r1-logs/lint.log
          python scripts/check_provenance.py 2>&1 | tee artifacts/r1-logs/provenance.log
          python -m unittest discover -s tests/host -v 2>&1 \
            | tee artifacts/r1-logs/host-tests.log
      - name: Install checksummed RISC-V SDK
        run: |
          set -euo pipefail
          python scripts/install_sdk.py "$RUNNER_TEMP/aic-sdk" \
            2>&1 | tee artifacts/r1-logs/sdk-install.log
          echo "ZEPHYR_SDK_INSTALL_DIR=$RUNNER_TEMP/aic-sdk/zephyr-sdk-1.0.1" >> "$GITHUB_ENV"
      - name: QEMU runtime gate
        run: |
          set -euo pipefail
          python scripts/environment.py --output artifacts/environment.json \
            2>&1 | tee artifacts/r1-logs/environment.log
          west twister -p qemu_riscv32 -T samples/bringup -T tests/kernel -T tests/fpu \
            -T tests/clic -T tests/z0_stress --board-root boards \
            --outdir "$RUNNER_TEMP/aic-qemu" --inline-logs -j4 \
            2>&1 | tee artifacts/r1-logs/qemu-gate.log
      - name: Runtime negative probes
        run: |
          set -euo pipefail
          python scripts/runtime_probes.py "$RUNNER_TEMP/aic-negative" \
            --sdk "$ZEPHYR_SDK_INSTALL_DIR" 2>&1 | tee artifacts/r1-logs/runtime-probes.log
      - name: D13x build-only gate
        run: |
          set -euo pipefail
          west twister -p d50t_2_lite/d133ecs -T samples/bringup -T tests/kernel \
            -T tests/fpu -T tests/z0_stress --board-root boards --build-only \
            --outdir "$RUNNER_TEMP/aic-d13x" --inline-logs -j4 \
            2>&1 | tee artifacts/r1-logs/d13x-gate.log
          for application in bringup kernel fpu stress; do
            python scripts/build_candidate.py "$application" "$RUNNER_TEMP/aic-$application" \
              2>&1 | tee "artifacts/r1-logs/build-$application.log"
            python scripts/package_candidate.py "$RUNNER_TEMP/aic-$application" \
              "artifacts/candidates/$application" 2>&1 \
              | tee "artifacts/r1-logs/collect-$application.log"
          done
      - name: D13x stress hardware profile fits the experimental window
        run: |
          set -euo pipefail
          west build -b d50t_2_lite/d133ecs tests/z0_stress \
            --build-dir "$RUNNER_TEMP/aic-stress-window" --pristine -- \
            -DEXTRA_CONF_FILE="$GITHUB_WORKSPACE/zephyr-artinchip/tests/z0_stress/product-window.conf" \
            -DDTC_OVERLAY_FILE="$GITHUB_WORKSPACE/zephyr-artinchip/samples/handoff_probe/product-window.overlay" \
            2>&1 | tee artifacts/r1-logs/stress-window-build.log
          python scripts/window_fit.py "$RUNNER_TEMP/aic-stress-window/zephyr" \
            --expect CONFIG_AIC_Z0_STRESS_DURATION_SEC=600 \
            2>&1 | tee artifacts/r1-logs/stress-window-fit.log
      - name: Stage allowlisted success or failure evidence
        if: always()
        run: |
          set -euo pipefail
          python scripts/evidence.py stage artifacts/transport/software-evidence.zip \
            --status "${{ job.status }}" --qemu "$RUNNER_TEMP/aic-qemu" \
            --d13x "$RUNNER_TEMP/aic-d13x" --candidates artifacts/candidates \
            --logs artifacts/r1-logs --environment artifacts/environment.json \
            --negative "$RUNNER_TEMP/aic-negative"
      - name: Upload single evidence archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-evidence-hardware-pending
          path: zephyr-artinchip/artifacts/transport/software-evidence.zip
          if-no-files-found: error
      - name: Download uploaded evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: software-evidence-hardware-pending
          path: ${{ runner.temp }}/aic-downloaded
      - name: Verify downloaded inventory and hashes
        if: always()
        run: |
          set -euo pipefail
          python scripts/evidence.py verify "$RUNNER_TEMP/aic-downloaded/software-evidence.zip" \
            2>&1 | tee artifacts/r1-logs/evidence-verify.log
