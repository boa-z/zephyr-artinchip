# SPDX-License-Identifier: Apache-2.0
name: P0 and D13x software gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: zephyr-artinchip
    steps:
      - uses: actions/checkout@v4
        with:
          path: zephyr-artinchip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Bootstrap pinned workspace
        run: |
          python -m pip install -r requirements-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west init -l .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/apply_patches.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west manifest --validate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Lint, source provenance and host tests
        run: |
          python scripts/lint.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_provenance.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/host -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install checksummed RISC-V SDK
        run: |
          python scripts/install_sdk.py "$env:RUNNER_TEMP/aic-sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "ZEPHYR_SDK_INSTALL_DIR=$env:RUNNER_TEMP/aic-sdk/zephyr-sdk-1.0.1" >> $env:GITHUB_ENV
      - name: QEMU runtime gate
        run: |
          python scripts/environment.py --output artifacts/environment.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west twister -p qemu_riscv32 -T samples/bringup -T tests/kernel -T tests/fpu --board-root boards --outdir C:/aic-qemu --inline-logs -j4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: D13x build-only gate
        run: |
          west twister -p d50t_2_lite/d133ecs -T samples/bringup -T tests/kernel -T tests/fpu --board-root boards --build-only --outdir C:/aic-d13x --inline-logs -j4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west build -b d50t_2_lite/d133ecs samples/bringup -d C:/aic-candidate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/package_candidate.py C:/aic-candidate artifacts/d13x-candidate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain success and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-evidence-hardware-pending
          path: |
            C:/aic-qemu/**/twister*.json
            C:/aic-qemu/**/twister*.xml
            C:/aic-qemu/**/handler.log
            C:/aic-qemu/**/build.log
            C:/aic-d13x/**/twister*.json
            C:/aic-d13x/**/twister*.xml
            C:/aic-d13x/**/build.log
            zephyr-artinchip/artifacts
