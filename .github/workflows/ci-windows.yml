# SPDX-License-Identifier: Apache-2.0
# Windows compatibility run only: the required software gate job lives in ci.yml
# on ubuntu-26.04, so this workflow never blocks a push or a pull request and is
# started by hand when a Windows-specific regression needs to be checked.
name: Windows compatibility (optional)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: zephyr-artinchip
    steps:
      - uses: actions/checkout@v4
        with:
          path: zephyr-artinchip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Bootstrap pinned workspace
        run: |
          New-Item -ItemType Directory -Force artifacts/r1-logs | Out-Null
          Start-Transcript -Path artifacts/r1-logs/bootstrap.log
          python -m pip install -r requirements-windows.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west init -l .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/apply_patches.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west manifest --validate
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Lint, source provenance and host tests
        run: |
          Start-Transcript -Path artifacts/r1-logs/host-gates.log
          python scripts/lint.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/check_provenance.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/host -v *> artifacts/r1-logs/host-tests.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install checksummed RISC-V SDK
        run: |
          Start-Transcript -Path artifacts/r1-logs/sdk-install.log
          python scripts/install_sdk.py "$env:RUNNER_TEMP/aic-sdk"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "ZEPHYR_SDK_INSTALL_DIR=$env:RUNNER_TEMP/aic-sdk/zephyr-sdk-1.0.1" >> $env:GITHUB_ENV
      - name: QEMU runtime gate
        run: |
          Start-Transcript -Path artifacts/r1-logs/qemu-gate.log
          python scripts/environment.py --output artifacts/environment.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          west twister -p qemu_riscv32 -T samples/bringup -T tests/kernel -T tests/fpu -T tests/clic -T tests/z0_stress --board-root boards --outdir C:/aic-qemu --inline-logs -j4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Runtime negative probes
        run: |
          python scripts/runtime_probes.py C:/aic-negative --sdk "$env:ZEPHYR_SDK_INSTALL_DIR" *> artifacts/r1-logs/runtime-probes.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: D13x build-only gate
        run: |
          Start-Transcript -Path artifacts/r1-logs/d13x-gate.log
          west twister -p d50t_2_lite/d133ecs -T samples/bringup -T tests/kernel -T tests/fpu -T tests/z0_stress --board-root boards --build-only --outdir C:/aic-d13x --inline-logs -j4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($application in @('bringup', 'kernel', 'fpu', 'stress')) {
            python scripts/build_candidate.py $application "C:/aic-$application" *> "artifacts/r1-logs/build-$application.log"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python scripts/package_candidate.py "C:/aic-$application" "artifacts/candidates/$application" *> "artifacts/r1-logs/collect-$application.log"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          west build -b d50t_2_lite/d133ecs tests/z0_stress --build-dir C:/aic-stress-window --pristine -- -DEXTRA_CONF_FILE=$PWD/tests/z0_stress/product-window.conf -DDTC_OVERLAY_FILE=$PWD/samples/handoff_probe/product-window.overlay *> artifacts/r1-logs/stress-window-build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/window_fit.py C:/aic-stress-window/zephyr --expect CONFIG_AIC_Z0_STRESS_DURATION_SEC=600 *> artifacts/r1-logs/stress-window-fit.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Stage allowlisted success or failure evidence
        if: always()
        run: |
          python scripts/evidence.py stage artifacts/transport/software-evidence.zip --status "${{ job.status }}" --qemu C:/aic-qemu --d13x C:/aic-d13x --candidates artifacts/candidates --logs artifacts/r1-logs --environment artifacts/environment.json --negative C:/aic-negative
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload single evidence archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-evidence-hardware-pending-windows
          path: zephyr-artinchip/artifacts/transport/software-evidence.zip
          if-no-files-found: error
      - name: Download uploaded evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: software-evidence-hardware-pending-windows
          path: ${{ runner.temp }}/aic-downloaded
      - name: Verify downloaded inventory and hashes
        if: always()
        run: |
          python scripts/evidence.py verify "$env:RUNNER_TEMP/aic-downloaded/software-evidence.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
