sample:
  name: ArtInChip module bringup
tests:
  artinchip.bringup:
    platform_allow:
      - qemu_riscv32
      - d50t_2_lite/d133ecs
    integration_platforms:
      - qemu_riscv32
    tags:
      - kernel
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "MODULE: zephyr-artinchip"
        - "BRINGUP: thread/semaphore/timeout PASS"
  artinchip.bringup.no_assert:
    platform_allow: qemu_riscv32
    extra_configs:
      - CONFIG_ASSERT=n
    timeout: 30
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "MODULE: zephyr-artinchip"
        - "BRINGUP: thread/semaphore/timeout PASS"
